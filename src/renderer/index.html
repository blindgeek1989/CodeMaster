<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeMaster — Accessible Coding Learning Platform</title>
  <link rel="stylesheet" href="styles/main.css" />

  <!-- Module data -->
  <script src="data/git-content.js"></script>
  <script src="data/github-content.js"></script>
  <script src="data/typescript-content.js"></script>
  <script src="data/async-js-content.js"></script>
  <script src="data/react-content.js"></script>
  <script src="data/nextjs-content.js"></script>
  <script src="data/nodejs-content.js"></script>
  <script src="data/jest-content.js"></script>
  <script src="data/regex-content.js"></script>
  <script src="data/prompt-engineering-content.js"></script>
  <script src="data/think-programmer-content.js"></script>
  <script src="data/html-content.js"></script>
  <script src="data/css-content.js"></script>
  <script src="data/js-content.js"></script>
  <script src="data/python-content.js"></script>
  <script src="data/sql-content.js"></script>
  <script src="data/powershell-content.js"></script>
  <script src="data/aria-content.js"></script>
  <script src="data/scrum-intro-content.js"></script>
  <script src="data/scrum-master-content.js"></script>
  <script src="data/scrum-master-ai-content.js"></script>
  <script src="data/scrum-exam-prep-content.js"></script>
  <script src="data/glossary-content.js"></script>
</head>
<body>
  <!-- Skip to main content -->
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- Screen reader announcer (aria-live region) -->
  <div
    id="sr-announcer"
    class="sr-announcer"
    aria-live="assertive"
    aria-atomic="true"
    role="status"
  ></div>

  <!-- ===== Update notification banner ===== -->
  <section
    id="update-banner"
    class="update-banner"
    role="region"
    aria-label="Application update available"
    aria-live="polite"
    hidden
  >
    <div class="update-banner-top">
      <div class="update-info">
        <strong class="update-headline">
          <span id="update-version-label"></span> is available
        </strong>
        <button id="btn-whats-new" class="btn-whats-new" hidden>What's new</button>
      </div>
      <div class="update-actions" role="group" aria-label="Update actions">
        <button id="btn-download-update" class="btn-update-download">Download Update</button>
        <button id="btn-dismiss-update" class="btn-update-dismiss">Dismiss</button>
      </div>
    </div>
    <p id="update-error-msg" class="update-error-msg" hidden></p>

    <!-- Download progress (hidden until download starts) -->
    <div id="update-progress-section" class="update-progress-section" hidden>
      <div
        id="update-progress-bar"
        class="update-progress-bar"
        role="progressbar"
        aria-valuenow="0"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-label="Update download progress"
      ></div>
      <span id="update-progress-label" class="update-progress-label" aria-live="polite"></span>
    </div>

    <!-- Restart prompt (hidden until download completes) -->
    <div id="update-restart-section" class="update-restart-section" hidden>
      <span class="update-ready-msg">Update downloaded and ready to install.</span>
      <button id="btn-install-update" class="btn-update-install">Restart &amp; Install</button>
    </div>
  </section>

  <!-- ===== What's new modal ===== -->
  <div
    id="whats-new-modal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-whats-new-heading"
    hidden
  >
    <div class="modal-dialog">
      <h2 id="modal-whats-new-heading">What's new in this update</h2>
      <div id="modal-release-notes" class="modal-release-notes"></div>
      <button id="btn-close-whats-new" class="btn-primary">Close</button>
    </div>
  </div>

  <div class="app-layout">

    <!-- ===== Header ===== -->
    <header class="app-header" role="banner">
      <div class="header-brand">
        <span class="app-logo" aria-label="CodeMaster">Code<span>Master</span></span>
        <span class="app-tagline" aria-label="Accessible coding platform">Accessible Coding Platform</span>
        <span id="app-version-display" class="app-version" aria-label="Application version"></span>
      </div>

      <div class="header-toolbar">
        <button id="home-btn" class="toolbar-btn" aria-label="Go to home screen">Home</button>

        <div class="header-search" role="search">
          <label for="lesson-search" class="sr-only">Search lessons</label>
          <input
            type="search"
            id="lesson-search"
            class="lesson-search-input"
            placeholder="Search lessons…"
            autocomplete="off"
            aria-controls="search-results"
            aria-autocomplete="list"
          />
          <ul
            id="search-results"
            class="search-results"
            role="listbox"
            aria-label="Search results"
            hidden
          ></ul>
          <p id="search-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
        </div>

        <button
          id="bookmarks-toggle-btn"
          class="toolbar-btn"
          aria-expanded="false"
          aria-controls="bookmarks-panel"
        >Bookmarks</button>

        <div class="font-size-controls" role="group" aria-label="Text size">
          <button id="font-decrease" class="font-size-btn" aria-label="Decrease text size">A-</button>
          <span id="font-size-display" class="font-size-display" aria-live="polite" aria-atomic="true"></span>
          <button id="font-increase" class="font-size-btn" aria-label="Increase text size">A+</button>
        </div>

        <button id="glossary-btn" class="toolbar-btn">Glossary</button>
      </div>
    </header>

    <!-- Bookmarks panel (drops down from header) -->
    <div
      id="bookmarks-panel"
      class="bookmarks-panel"
      hidden
      role="region"
      aria-label="Bookmarks"
    >
      <ul id="bookmarks-list" class="bookmarks-list" role="list"></ul>
    </div>

    <!-- ===== Main ===== -->
    <main class="main-content" id="main-content" tabindex="-1">
      <!-- Content is loaded dynamically by app.js -->
    </main>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
